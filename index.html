<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOOD LAB — 心理測驗室</title>
<meta name="theme-color" content="#eee7d8">
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="mood-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eae3d5;--card:#faf6eb;--ink:#3c3b31;--mute:#777669;--line:#d8cdbc;--acc:#5d6e59;--acc2:#bb933f;--accbg:#e2e5d6;--warn:#a8503f;--warnbg:#f5e3dc;--shadow:0 1px 2px rgba(60,50,30,.06),0 6px 20px rgba(60,50,30,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#1d1e1a;--card:#272820;--ink:#ece7da;--mute:#a39f90;--line:#3a3b32;--acc:#9db398;--acc2:#d6b25e;--accbg:#2c3528;--warn:#f0957f;--warnbg:#3a2620;--shadow:none}.btn,.chip.on,.tag.done{color:#1d1e1a!important}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;background-image:radial-gradient(#73664c14 .7px,transparent .7px);background-size:5px 5px;line-height:1.7;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hwrap{max-width:820px;margin:0 auto;padding:10px 16px 0}
h1{font-size:19px;margin:0 0 6px;letter-spacing:.5px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:8px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:18px;margin:26px 0 10px}
h3{font-size:16px;margin:0 0 4px}
p{margin:6px 0}
.mute{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.tcard{cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px;transition:transform .12s}
.tcard:hover{transform:translateY(-2px)}
.tcard .em{font-size:26px}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:1px 9px;background:var(--accbg);color:var(--acc)}
.tag.done{background:var(--acc);color:#fff}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer}
.btn.ghost{background:none;color:var(--acc)}
.btn.sm{padding:3px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 18px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .25s}
.q{font-size:18px;font-weight:600;margin:14px 0 18px}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;text-align:left;cursor:pointer}
.opt:hover,.opt.sel{border-color:var(--acc);background:var(--accbg)}
.lik{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lik .opt{text-align:center;padding:12px 2px;font-size:13px}
.bar{margin:12px 0}
.bar .bl{display:flex;justify-content:space-between;font-size:14px}
.bar .bt{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0}
.bar .bt i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px}
.care{background:var(--warnbg);border:1px solid var(--warn);color:var(--ink);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px}
.note{font-size:12.5px;color:var(--mute);border-top:1px dashed var(--line);margin-top:18px;padding-top:10px}
.big{font-size:26px;font-weight:700;margin:4px 0}
ul.t{padding-left:20px;margin:6px 0}
textarea,input[type=text],select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input[type=range]{width:100%;accent-color:var(--acc)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.breath{width:150px;height:150px;border-radius:50%;margin:16px auto;background:radial-gradient(circle,var(--accbg),var(--acc));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;transform:scale(.6)}
.breath.go{animation:br 19s linear infinite}
@keyframes br{0%{transform:scale(.6)}21%{transform:scale(1)}58%{transform:scale(1)}100%{transform:scale(.6)}}
.sect{border-left:4px solid var(--acc);padding-left:12px;margin:14px 0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:6px}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
</style>
</head>
<body>
<header><div class="hwrap"><h1>MOOD LAB <small style="font-weight:400;font-size:13px;color:var(--mute)">心理測驗室</small></h1>
<nav id="nav"></nav></div></header>
<main id="app"></main>
<script>
/* ========= 資料 ========= */
const LIK=['完全不符合','不太符合','普通','有點符合','非常符合'];
const FREQ=['幾乎沒有','偶爾','有時','經常','幾乎總是'];
const CATS={personality:'性格與人格',fun:'趣味娛樂',well:'情緒與壓力',mind:'思維與成長'};
const HELP='如果你覺得撐不下去，或有傷害自己的念頭，請立刻聯絡 1925 安心專線（24 小時）或 1995 生命線，也可以告訴身邊信任的人。';

const TESTS=[
{id:'big5',cat:'personality',em:'🌿',title:'大五人格速測',desc:'從五個向度認識自己的性格底色。',kind:'likert',scale:LIK,
 dims:{E:{n:'外向性',hi:'你從人群與互動中獲得能量，行動力與表達力強。',lo:'你偏好安靜、少量深入的互動，獨處是充電時間。'},
 A:{n:'親和性',hi:'你體貼、願意合作，重視關係的和諧。',lo:'你直率、重視原則與效率，不太怕衝突。'},
 C:{n:'盡責性',hi:'你有條理、可靠，擅長規劃與執行。',lo:'你彈性、隨興，擅長臨場應變，但需要留意拖延。'},
 N:{n:'情緒敏感度',hi:'你對壓力與情緒變化較敏感，細膩但也容易擔心。',lo:'你情緒相對穩定，遇事不容易慌。'},
 O:{n:'開放性',hi:'你好奇、愛想像，喜歡新鮮事物與抽象想法。',lo:'你務實、偏好熟悉可預期的做法。'}},
 qs:[['我在人多的場合會覺得很有活力','E'],['我喜歡主動認識新朋友','E'],['我獨處時比和別人在一起更自在','E',1],['我說話或做事的節奏通常很快','E'],
 ['我很在意別人的感受','A'],['為了和諧我常願意讓步','A'],['我容易懷疑別人的動機','A',1],['我樂於幫助需要幫忙的人','A'],
 ['我會先規劃再行動','C'],['我的東西通常整理得井然有序','C'],['我常拖到最後一刻才動手','C',1],['答應別人的事我一定做到','C'],
 ['小事也容易讓我緊張或擔心','N'],['我的心情起伏很大','N'],['遇到壓力時我能很快平靜下來','N',1],['我常反覆想著自己做錯的事','N'],
 ['我對新奇的想法與藝術很有興趣','O'],['我喜歡嘗試沒做過的事','O'],['我偏好熟悉固定的做法','O',1],['我常陷入天馬行空的想像','O']]},

{id:'pref4',cat:'personality',em:'🧩',title:'四維度偏好測驗',desc:'外向/內向、實感/直覺、思考/情感、計畫/彈性，12 題看你的傾向。（非官方 MBTI）',kind:'pair',
 pairs:[['E','I','外向','內向'],['S','N','實感','直覺'],['T','F','思考','情感'],['J','P','計畫','彈性']],
 letters:{E:'從互動中充電，愛說也愛行動',I:'從獨處中充電，思考後再開口',S:'重視事實、細節與經驗',N:'重視可能性、概念與全貌',T:'決策偏重邏輯與公平',F:'決策偏重價值與人際感受',J:'喜歡事先安排、有結論才安心',P:'喜歡保持彈性、邊走邊調整'},
 qs:[['週末空下來，你比較想…',['E','找朋友聚會'],['I','自己待著放空']],['在聚會裡你通常…',['E','主動聊很多人'],['I','和少數人深聊']],['想事情時你…',['E','邊講邊想'],['I','在腦中想清楚再說']],
 ['學新東西時你偏好…',['S','具體步驟與範例'],['N','先理解整體概念']],['你比較相信…',['S','親眼所見的證據'],['N','直覺與靈感']],['你更欣賞的人是…',['S','腳踏實地的人'],['N','富有遠見的人']],
 ['朋友向你訴苦，你第一反應是…',['T','幫他分析問題'],['F','先陪他感受']],['做重要決定時你更看重…',['T','客觀利弊'],['F','對人的影響']],['討論意見分歧時你…',['T','就事論事、指出問題'],['F','顧及氣氛、委婉表達']],
 ['出門旅行你偏好…',['J','事先排好行程'],['P','到了再看']],['面對截止日，你通常…',['J','提早完成'],['P','靠臨場爆發力']],['你的桌面或房間…',['J','有固定位置、整齊'],['P','亂中有序、順手就好']]]},

{id:'attach',cat:'personality',em:'💞',title:'親密關係依附風格',desc:'你在關係中的安全感，來自「焦慮」和「逃避」兩個軸。',kind:'likert',scale:LIK,
 dims:{anx:{n:'依附焦慮',hi:'你很在乎關係是否穩固，容易擔心被拋下。',lo:'你較能相信關係，不太需要時時確認。'},
 avo:{n:'依附逃避',hi:'你習慣保持距離、靠自己，親密太近會不自在。',lo:'你能自在地依靠別人，也願意被依靠。'}},
 qs:[['我常擔心對方沒有我在乎他那麼在乎我','anx'],['對方沒回訊息時，我會忍不住胡思亂想','anx'],['我很害怕被拋棄','anx'],['我需要常常被確認「你愛我」','anx'],['我擔心自己不夠好、配不上對方','anx'],['感情中我容易吃醋或不安','anx'],
 ['我不習慣向伴侶透露內心深處的感受','avo'],['當對方想更靠近時，我會想退開','avo'],['依賴別人會讓我不舒服','avo'],['我偏好和伴侶維持一點距離','avo'],['我覺得靠自己比靠別人安全','avo'],['我很容易對伴侶敞開心扉','avo',1]],
 result:s=>{const a=s.anx>=50,v=s.avo>=50;const m={
 '11':['恐懼型（焦慮＋逃避）','你渴望親近，卻又害怕受傷，因此容易在靠近與退縮間拉扯。','練習把「我怕」說出口，並從低風險的小事開始信任。'],
 '10':['焦慮型','你很投入關係，對訊號敏感，安全感常依賴對方回應。','練習自我安撫：先給自己 10 分鐘冷靜，再用「我感到…我需要…」溝通。'],
 '01':['迴避型','你重視獨立與空間，親密時容易築牆。','練習在安全的人面前，每週分享一件真實的感受。'],
 '00':['安全型','你能在親密與獨立之間取得平衡，也較能坦誠溝通。','維持現有的溝通習慣，也可以成為伴侶的穩定力量。']}[(a?1:0)+''+(v?1:0)];
 return {title:m[0],text:m[1],tips:[m[2],'依附風格不是命運，會隨經驗與安全的關係而改變。']}}},

{id:'stress',cat:'well',em:'🌧️',title:'壓力指數自評',desc:'最近一個月的壓力感受（參考 PSS 概念，原創題目）。',kind:'likert',scale:FREQ,tot:1,
 qs:[['覺得事情不在自己的掌控之中'],['覺得緊繃、壓力很大'],['覺得無法應付所有該做的事'],['因為意外發生的事而心煩'],['覺得困難堆得像山一樣高'],['對處理自己的問題有信心',1],['覺得事情進展順利',1],['能掌控生活中惱人的事',1]],
 bands:[[35,'壓力偏低','你目前的壓力感受在可管理範圍。',['維持規律作息與運動','留意壓力升高的早期訊號']],[65,'壓力中等','你正承受一定壓力，值得開始照顧自己。',['盤點壓力源：可控／不可控','每天安排 15 分鐘完全屬於自己的時間','試試「心理練習」裡的呼吸與著陸']],[100,'壓力偏高','你近期壓力負荷明顯偏高。',['先減少一件非必要的事','與信任的人聊聊，或尋求專業協助','優先保護睡眠']]]},

{id:'sleep',cat:'well',em:'🌙',title:'睡眠品質自評',desc:'8 題了解最近的睡眠狀態（原創題目，非診斷）。',kind:'likert',scale:FREQ,tot:1,
 qs:[['入睡要花超過 30 分鐘'],['半夜醒來後很難再睡著'],['比預期更早醒來'],['白天感到精神不濟'],['睡前很晚還在滑手機'],['睡醒後覺得休息充足',1],['睡眠時間很不規律'],['睡不好影響到白天的表現']],
 bands:[[35,'睡眠狀態良好','你的睡眠看起來相當穩定。',['維持固定起床時間','睡前一小時降低螢幕亮度']],[65,'睡眠需要留意','最近睡眠品質有些起伏。',['固定上床與起床時間','下午後減少咖啡因','睡前寫下待辦事項，減少腦中盤旋']],[100,'睡眠明顯受擾','睡眠困擾已影響日常。',['建立睡前放鬆儀式','若持續兩週以上，建議諮詢醫師或睡眠專科']]]},

{id:'anx',cat:'well',em:'🌀',title:'焦慮情緒自評',desc:'過去兩週的緊張與擔心程度（參考 GAD 概念，原創題目，非診斷）。',kind:'likert',scale:FREQ,tot:1,care:1,
 qs:[['覺得緊張、不安或煩躁'],['無法停止或控制自己的擔心'],['對很多事情過度擔心'],['很難放鬆下來'],['坐立不安，難以靜坐'],['容易生氣或煩躁'],['害怕好像有不好的事情要發生']],
 bands:[[35,'焦慮感偏低','近期焦慮感不明顯。',['保持現有的紓壓習慣']],[65,'輕中度緊張','你有一些緊張與擔心，值得留意。',['嘗試「擔憂時間盒」練習','規律運動與呼吸練習']],[100,'焦慮感偏高','近期焦慮感明顯。這不是診斷，但建議與專業人員聊聊。',['預約心理師、身心科或學校/公司諮商資源','先從呼吸與著陸練習降低當下強度']]]},

{id:'mood',cat:'well',em:'☁️',title:'心情低落自評',desc:'過去兩週的情緒低落程度（參考 PHQ 概念，原創題目，非診斷）。',kind:'likert',scale:FREQ,tot:1,care:1,
 qs:[['對平常喜歡的事提不起興趣'],['心情低落、沒有精神'],['難以專心做事'],['覺得疲倦、沒有力氣'],['覺得自己很糟、讓人失望'],['食慾或睡眠和平常不一樣'],['動作或想法變得遲緩']],
 bands:[[35,'情緒狀態尚穩','近期低落感不明顯。',['保持社交與活動節奏']],[65,'情緒有些低落','你近期情緒偏低，請對自己溫柔一點。',['安排一件小而具體的愉快活動','每天出門走 10 分鐘','和信任的人聊聊近況']],[100,'低落感偏高','低落感已明顯影響你。這不是診斷，但很值得尋求協助。',['盡快預約心理師或身心科','告訴一位信任的人你的狀況']]]},

{id:'iu',cat:'mind',em:'🌫️',title:'不確定性容忍度',desc:'面對未知時，你多自在？分數越高＝越難容忍。',kind:'likert',scale:LIK,tot:1,
 qs:[['不確定的情況會讓我不安'],['我討厭不知道接下來會發生什麼'],['計畫被打亂時我很難受'],['要先確認所有細節我才敢行動'],['面對未知，我會往最壞的方向想'],['我能接受事情沒有明確答案',1],['不確定的狀況有時反而有趣',1],['遇到不確定，我會一直查資料想確認']],
 bands:[[35,'容忍度高','你能與未知共處，彈性較大。',['繼續保持好奇，把未知當成探索']],[65,'容忍度中等','你有時能放鬆，有時會被未知困住。',['練習「擔憂時間盒」','每週做一件不事先規劃的小事']],[100,'容忍度偏低','不確定性讓你很不舒服，容易過度準備或反覆確認。',['從低風險的小事開始練習「先不確認」','區分「可控」與「不可控」的擔心','必要時尋求認知行為取向的協助']]]},

{id:'bound',cat:'mind',em:'🚧',title:'個人界線強度',desc:'你能不能清楚、溫和地說「不」？分數越高＝界線越清晰。',kind:'likert',scale:LIK,tot:1,

/* ========= 計分（純函式） ========= */
function qtext(t,i){return t.qs[i][0]}
function keysOf(t){return t.kind==='likert'?(t.dims?Object.keys(t.dims):['total']):t.kind==='choice'?Object.keys(t.types):t.pairs.map(p=>p[0]+p[1])}
function nameOf(t,k){if(t.kind==='likert')return t.dims?t.dims[k].n:'總分';if(t.kind==='choice')return t.types[k].n;const p=t.pairs.find(p=>p[0]+p[1]===k);return p[2]+'↔'+p[3]}
function score(t,ans){
 const s={};
 if(t.kind==='likert'){
  const acc={};
  t.qs.forEach((q,i)=>{const d=t.dims?q[1]:'total';const rev=t.dims?q[2]:q[1];let v=ans[i];if(rev)v=6-v;(acc[d]=acc[d]||[]).push(v)});
  for(const d in acc){const m=acc[d].reduce((a,b)=>a+b,0)/acc[d].length;s[d]=Math.round((m-1)/4*100)}
 }else if(t.kind==='choice'){
  const c={};Object.keys(t.types).forEach(k=>c[k]=0);
  t.qs.forEach((q,i)=>{c[q[1+ans[i]][0]]++});
  for(const k in c)s[k]=Math.round(c[k]/t.qs.length*100);
 }else{
  t.pairs.forEach(p=>{let a=0,n=0;t.qs.forEach((q,i)=>{const l=q[1+ans[i]][0];if(l===p[0]||l===p[1]){n++;if(l===p[0])a++}});s[p[0]+p[1]]=n?Math.round(a/n*100):50});
 }
 return s;
}
function interpret(t,s){
 const r={title:'',text:'',tips:[],items:[]};
 if(t.kind==='likert'&&!t.dims){
  const v=s.total;const b=t.bands.find(b=>v<=b[0])||t.bands[t.bands.length-1];
  r.title=b[1];r.text=b[2];r.tips=b[3];r.items=[{n:'總分',v,note:''}];r.care=!!t.care&&b===t.bands[t.bands.length-1];
 }else if(t.kind==='likert'){
  if(t.result){const x=t.result(s);Object.assign(r,x)}
  else{
   const ks=keysOf(t).sort((a,b)=>s[b]-s[a]);
   r.title='最突出：'+nameOf(t,ks[0]);r.text=t.dims[ks[0]].hi||'';
   r.tips=['分數只代表你「目前自評」的傾向，沒有好壞。'];
  }
  r.items=keysOf(t).map(k=>{const d=t.dims[k],v=s[k];return{n:d.n,v,note:v>=65?d.hi:v<=35?d.lo:'介於中間，會隨情境彈性調整。'}});
 }else if(t.kind==='choice'){
  const ks=keysOf(t).sort((a,b)=>s[b]-s[a]);
  r.title=t.types[ks[0]].n;r.text=t.types[ks[0]].t;r.items=ks.map(k=>({n:t.types[k].n,v:s[k],note:''}));
  r.tips=['這是趣味測驗，結果僅供娛樂與自我對話。'];
 }else{
  const code=t.pairs.map(p=>s[p[0]+p[1]]>=50?p[0]:p[1]).join('');
  r.title=code;r.text=code.split('').map(l=>l+'：'+t.letters[l]).join('\n');

  r.tips=['這只是偏好傾向，不是人格分類的定論，也和官方 MBTI 無關。'];
 }
 return r;
}

function radar(t,hist,keys){
 const n=keys.length;if(n<3||!hist.length)return'';
 const cx=140,cy=122,R=78;
 const pt=(i,v)=>{const a=-Math.PI/2+2*Math.PI*i/n;return[cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
 const poly=(f)=>keys.map((k,i)=>pt(i,f(k)).map(x=>x.toFixed(1)).join(',')).join(' ');
 let g=[25,50,75,100].map(v=>`<polygon points="${keys.map((k,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="currentColor" opacity=".15"/>`).join('');
 g+=keys.map((k,i)=>{const e=pt(i,100),l=pt(i,122);const an=l[0]<cx-8?'end':l[0]>cx+8?'start':'middle';return `<line x1="${cx}" y1="${cy}" x2="${e[0]}" y2="${e[1]}" stroke="currentColor" opacity=".15"/><text x="${l[0]}" y="${l[1]+4}" font-size="12" text-anchor="${an}" fill="currentColor">${esc(nameOf(t,k))}</text>`}).join('');
 const last=hist[hist.length-1],first=hist[0];
 if(hist.length>1)g+=`<polygon points="${poly(k=>first.scores[k]||0)}" fill="none" stroke="var(--acc2)" stroke-width="2" stroke-dasharray="5 4"/>`;
 g+=`<polygon points="${poly(k=>last.scores[k]||0)}" fill="var(--acc)" fill-opacity=".28" stroke="var(--acc)" stroke-width="2.5"/>`;
 return `<svg viewBox="0 0 280 244" width="100%" style="max-width:380px;display:block;margin:auto" role="img" aria-label="雷達圖">${g}</svg><div class="legend" style="justify-content:center"><span><i style="background:var(--acc)"></i>最近一次</span>${hist.length>1?'<span><i style="background:var(--acc2)"></i>第一次</span>':''}</div>`;
}
function spark(vals){
 if(vals.length<2)return'<span class="mute">—</span>';
 const W=90,H=26,x=i=>3+i*(W-6)/(vals.length-1),y=v=>H-3-v/100*(H-6);
 return `<svg viewBox="0 0 ${W} ${H}" width="90" height="26"><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${vals.map((v,i)=>x(i)+','+y(v)).join(' ')}"/><circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="3" fill="var(--acc2)"/></svg>`;
}
function moodChart(m){
 const d=m.slice(-14);if(!d.length)return'';
 const W=640,H=150,P=24,bw=Math.min(34,(W-2*P)/d.length-6);
 const x=i=>P+(i+.5)*(W-2*P)/d.length,y=v=>H-P-v/10*(H-2*P);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="心情強度圖">`+[0,5,10].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".15"/><text x="2" y="${y(v)+4}" font-size="11" fill="currentColor" opacity=".6">${v}</text>`).join('')+d.map((e,i)=>`<rect x="${x(i)-bw/2}" y="${y(e.i)}" width="${bw}" height="${H-P-y(e.i)}" rx="4" fill="var(--acc)" opacity=".8"/><text x="${x(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".7">${esc(e.e)}</text>`).join('')+`</svg>`;
}
const COL=['#5d6e59','#bb933f','#6d7bd6','#ad7366','#7aa84a','#8a6f9e'];
function chart(t,hist,keys){
 const W=640,H=220,P=30,n=hist.length;if(!n)return'';
 const x=i=>n===1?W/2:P+i*(W-2*P)/(n-1),y=v=>H-P-v/100*(H-2*P);
 let g=[0,50,100].map(v=>`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".15"/><text x="2" y="${y(v)+4}" font-size="11" fill="currentColor" opacity=".6">${v}</text>`).join('');
 keys.forEach((k,j)=>{const pts=hist.map((h,i)=>[x(i),y(h.scores[k]==null?0:h.scores[k])]);
  g+=`<polyline fill="none" stroke="${COL[j%6]}" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${COL[j%6]}"/>`).join('')});
 g+=hist.map((h,i)=>`<text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">${new Date(h.ts).getMonth()+1}/${new Date(h.ts).getDate()}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="成長趨勢圖">${g}</svg><div class="legend">${keys.map((k,j)=>`<span><i style="background:${COL[j%6]}"></i>${esc(nameOf(t,k))}</span>`).join('')}</div>`;
}

 else diff='<p class="mute">再做一次同一個測驗，就能看到變化。</p>';
 return `<h2 style="margin-top:0">成長追蹤</h2>
 <h3>總覽</h3><div class="card"><table>${ids.map(i=>{const tt=byId(i),hh=mem.history.filter(x=>x.id===i);const sp=(tt.dims||tt.kind!=='likert')?'':spark(hh.map(x=>x.scores.total));return `<tr><td>${tt.em} ${tt.title}</td><td>${hh.length} 次</td><td>${esc(hh[hh.length-1].label)}</td><td>${sp}</td></tr>`}).join('')}</table></div>
 <h3 style="margin-top:18px">詳細圖表</h3><div class="chips">${ids.map(i=>`<button class="chip ${i===id?'on':''}" data-a="growth" data-v="${i}">${byId(i).title}</button>`).join('')}</div>

 <h2>歷次紀錄</h2><table>${hist.map(h=>`<tr><td>${fmt(h.ts)}</td><td>${esc(h.label)}</td><td style="text-align:right"><button class="btn ghost sm" data-a="del" data-v="${h.ts}">刪除</button></td></tr>`).join('')}</table>

 <div class="chips">${EMOS.map(e=>`<button class="chip ${f.emo===e?'on':''}" data-a="set" data-k="emo" data-v="${e}">${e}</button>`).join('')}</div>
 <label class="f">強度：<b>${f.ei==null?5:f.ei}</b> / 10</label><input type="range" min="1" max="10" value="${f.ei==null?5:f.ei}" data-f="ei" data-live="1">
 <label class="f">一句話描述（例如：我感到…因為…）</label><input type="text" data-f="en" value="${esc(f.en)}">
 <p><button class="btn" data-a="savemood">記錄心情</button></p>
 ${m.length?`<p class="mute" style="margin-top:12px">最近心情強度</p>${moodChart(m)}<ul class="t">${m.slice(-4).reverse().map(x=>`<li>${fmt(x.ts)}：${esc(x.e)} ${x.i}/10 ${esc(x.n||'')}</li>`).join('')}</ul>`:''}</div>
 <p class="note">練習不能取代專業協助。${HELP}</p>`;
}

function vLibrary(){
 return `<h2 style="margin-top:0">心理學知識庫</h2><p class="mute">概念、研究來源與改善方法。來源為學術文獻的引用索引，請以原始文獻為準。</p>
 ${LIB.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p><p><b>研究來源：</b>${x[2]}</p><p><b>改善方法：</b>${x[3]}</p></details>`).join('')}`;
}

/* ===== 呼吸 ===== */
function stopBreath(){if(S.breath){clearInterval(S.breath);S.breath=null}}
function startBreath(){
 const t0=Date.now();
 S.breath=setInterval(()=>{const el=$('#br');if(!el){stopBreath();return}const p=((Date.now()-t0)/1000)%19;el.textContent=p<4?'吸氣':p<11?'停住':'吐氣'},200);
}

/* ===== 事件 ===== */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;
 const a=b.dataset.a,v=b.dataset.v;
 if(a==='tab')go(v);
 else if(a==='cat'){S.cat=v;render()}
 else if(a==='start'){S.tab='lobby';S.res=null;S.run={id:v,i:0,a:[]};render();window.scrollTo(0,0)}
 else if(a==='quit'){S.run=null;render()}
 else if(a==='back'){S.run.i--;render()}
 else if(a==='ans'){const r=S.run,t=byId(r.id);r.a[r.i]=+v;
  if(r.i<t.qs.length-1){const idx=r.i;setTimeout(()=>{if(S.run===r&&r.i===idx){r.i++;render()}},180);render()}
  else finish()}
 else if(a==='growth'){S.tab='growth';S.gsel=v;S.res=null;try{history.replaceState(null,'','#growth')}catch(e){}render();window.scrollTo(0,0)}
 else if(a==='del'){mem.history=mem.history.filter(x=>String(x.ts)!==v);persist();render()}
 else if(a==='wipe'){if(S.confirmWipe){mem.history=[];persist();S.confirmWipe=0}else{S.confirmWipe=1;b.textContent='再按一次確認清除';return}render()}
 else if(a==='set'){S.f[b.dataset.k]=b.dataset.v;render()}
 else if(a==='saveworry'){const f=S.f;if(!f.wtxt)return;mem.notes.worries.push({ts:Date.now(),t:f.wtxt,p:f.wp==null?50:f.wp,a:f.wact||''});persist();['wtxt','wp','wc','wact'].forEach(k=>delete f[k]);render()}
 else if(a==='savemood'){const f=S.f;if(!f.emo)return;mem.notes.moods.push({ts:Date.now(),e:f.emo,i:f.ei==null?5:f.ei,n:f.en||''});persist();['emo','ei','en'].forEach(k=>delete f[k]);render()}
 else if(a==='copy'){const s=$('#sent').textContent;const m=$('#cpmsg');try{navigator.clipboard.writeText(s).then(()=>m.textContent='已複製',()=>m.textContent='請手動選取文字複製')}catch(x){m.textContent='請手動選取文字複製'}}
 else if(a==='breath'){if(S.breath)stopBreath();else startBreath();render()}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.a==='scen'){S.sc=+el.value;render()}});
document.addEventListener('input',e=>{
 const el=e.target,k=el.dataset.f;if(!k)return;
 if(el.type==='checkbox'){S.f[k]=el.checked;return}
 if(k==='scen')return;
 S.f[k]=el.type==='range'?+el.value:el.value;
 if(el.dataset.live){const lab=el.previousElementSibling.querySelector('b');if(lab)lab.textContent=el.value+(k==='wp'?'%':'')}
 if(['fact','feel','ask','alt'].includes(k)){const f=S.f;$('#sent').textContent=`當${f.fact||'（事實）'}，我覺得${f.feel||'（感受）'}。我希望${f.ask||'（請求）'}。${f.alt?'如果不行，我可以'+f.alt+'。':''}`}
});
function finish(){
 const r=S.run,t=byId(r.id),s=score(t,r.a),x=interpret(t,s);
 mem.history.push({id:t.id,ts:Date.now(),scores:s,label:x.title});persist();
 S.run=null;S.res={t,s,r:x};render();window.scrollTo(0,0);
}
const h0=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h0))S.tab=h0;
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h)&&h!==S.tab)go(h)});
render();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
</body>
</html>
