<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOOD LAB — 心理測驗室</title>
<meta name="theme-color" content="#eee7d8">
<link rel="manifest" href="site.webmanifest">

<style>
:root{--bg:#eae3d5;--card:#faf6eb;--ink:#3c3b31;--mute:#5a594e;--line:#d8cdbc;--acc:#5d6e59;--acc2:#bb933f;--accbg:#e2e5d6;--warn:#a8503f;--warnbg:#f5e3dc;--shadow:0 1px 2px rgba(60,50,30,.06),0 6px 20px rgba(60,50,30,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#1d1e1a;--card:#272820;--ink:#ece7da;--mute:#c2beaf;--line:#3a3b32;--acc:#9db398;--acc2:#d6b25e;--accbg:#2c3528;--warn:#f0957f;--warnbg:#3a2620;--shadow:none}.btn,.chip.on,.tag.done{color:#1d1e1a!important}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;background-image:radial-gradient(#73664c14 .7px,transparent .7px);background-size:5px 5px;line-height:1.7;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hwrap{max-width:820px;margin:0 auto;padding:10px 16px 0}
h1{font-size:19px;margin:0 0 6px;letter-spacing:.5px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:8px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:18px;margin:26px 0 10px}
h3{font-size:16px;margin:0 0 4px}
p{margin:6px 0}
.mute{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.tcard{cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px;transition:transform .12s}
.tcard:hover{transform:translateY(-2px)}
.tcard .em{font-size:26px}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:1px 9px;background:var(--accbg);color:var(--acc)}
.tag.done{background:var(--acc);color:#fff}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer}
.btn.ghost{background:none;color:var(--acc)}
.btn.sm{padding:3px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 18px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .25s}
.q{font-size:18px;font-weight:600;margin:14px 0 18px}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;text-align:left;cursor:pointer}
.opt:hover,.opt.sel{border-color:var(--acc);background:var(--accbg)}
.lik{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lik .opt{text-align:center;padding:12px 2px;font-size:13px}
.bar{margin:12px 0}
.bar .bl{display:flex;justify-content:space-between;font-size:14px}
.bar .bt{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0}
.bar .bt i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px}
.care{background:var(--warnbg);border:1px solid var(--warn);color:var(--ink);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px}
.note{font-size:12.5px;color:var(--mute);border-top:1px dashed var(--line);margin-top:18px;padding-top:10px}
.big{font-size:26px;font-weight:700;margin:4px 0}
ul.t{padding-left:20px;margin:6px 0}
textarea,input[type=text],select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input[type=range]{width:100%;accent-color:var(--acc)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.breath{width:150px;height:150px;border-radius:50%;margin:16px auto;background:radial-gradient(circle,var(--accbg),var(--acc));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;transform:scale(.6)}
.breath.go{animation:br 19s linear infinite}
@keyframes br{0%{transform:scale(.6)}21%{transform:scale(1)}58%{transform:scale(1)}100%{transform:scale(.6)}}
.sect{border-left:4px solid var(--acc);padding-left:12px;margin:14px 0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:6px}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.tc{display:flex;flex-direction:column;gap:12px}.tc-h{display:flex;gap:12px;align-items:flex-start}.tc-h h3{margin:0 0 2px}
.tc-b{display:flex;flex-direction:column;gap:6px}.tc-b .btn{text-align:left}
.tc-f{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px dashed var(--line)}
.ic{color:var(--acc);flex:none}.ic .ac{stroke:var(--acc2)}
.tag.std{background:var(--acc2);color:#2a2820}.tag.none{background:none;border:1px solid var(--line);color:var(--mute)}
.card p.mute,.note{line-height:1.7}
</style>
</head>

<main id="app"></main>

const TESTS=[
{id:'big5',cat:'personality',em:'🌿',title:'大五人格速測',desc:'從五個向度認識自己的性格底色。',kind:'likert',scale:LIK,

 C:{n:'盡責性',hi:'你有條理、可靠，擅長規劃與執行。',lo:'你彈性、隨興，擅長臨場應變，但需要留意拖延。'},

 ['我很在意別人的感受','A'],['為了和諧我常願意讓步','A'],['我容易懷疑別人的動機','A',1],['我樂於幫助需要幫忙的人','A'],
 ['我會先規劃再行動','C'],['我的東西通常整理得井然有序','C'],['我常拖到最後一刻才動手','C',1],['答應別人的事我一定做到','C'],
 ['小事也容易讓我緊張或擔心','N'],['我的心情起伏很大','N'],['遇到壓力時我能很快平靜下來','N',1],['我常反覆想著自己做錯的事','N'],
 ['我對新奇的想法與藝術很有興趣','O'],['我喜歡嘗試沒做過的事','O'],['我偏好熟悉固定的做法','O',1],['我常陷入天馬行空的想像','O']]},

{id:'pref4',cat:'personality',em:'🧩',title:'四維度偏好測驗',desc:'外向/內向、實感/直覺、思考/情感、計畫/彈性，12 題看你的傾向。（非官方 MBTI）',kind:'pair',

 letters:{E:'從互動中充電，愛說也愛行動',I:'從獨處中充電，思考後再開口',S:'重視事實、細節與經驗',N:'重視可能性、概念與全貌',T:'決策偏重邏輯與公平',F:'決策偏重價值與人際感受',J:'喜歡事先安排、有結論才安心',P:'喜歡保持彈性、邊走邊調整'},
 qs:[['週末空下來，你比較想…',['E','找朋友聚會'],['I','自己待著放空']],['在聚會裡你通常…',['E','主動聊很多人'],['I','和少數人深聊']],['想事情時你…',['E','邊講邊想'],['I','在腦中想清楚再說']],

{id:'attach',cat:'personality',title:'親密關係依附風格',desc:'探索親密、自主與安全感。以「焦慮」與「逃避」兩個連續軸呈現，不貼類型標籤。',kind:'likert',scale:LIK,xy:['anx','avo'],deep:'attach_d',

  const lines=[];

  if(u>=60&&v<50)lines.push('你的抗拒更像是針對「義務與被控制」，而不是親密本身。你可能並不排斥靠近，只是需要靠近是出於自願、而且保有選擇權。');
  else if(u>=60&&v>=60)lines.push('自主敏感與親密不適同時偏高：除了怕被要求，靠近本身也讓你不安。可以留意哪一邊更主要。');
  if(a>=60&&v>=60)lines.push('你同時渴望靠近又害怕受傷，容易在「想靠近」與「想退開」之間拉扯。');
  else if(a>=60)lines.push('你渴望親近、也很怕失去，安全感相當依賴對方的回應。');
  else if(v>=60&&u<60)lines.push('你在親密與揭露上較有保留，傾向靠自己消化。');
  if(s.trust>=60)lines.push('信任需要時間，你會用觀察與測試來確認安全。');
  if(s.conf>=60)lines.push('衝突後的修復是你的功課之一。');

  if(!lines.length)lines.push('各構面都沒有特別突出，整體偏穩定、彈性。');
  return {title:'焦慮軸 '+a+'・逃避軸 '+v,text:lines.join('\n'),

function sdtRes(s){
 const D={aut:'自主感',com:'勝任感',rel:'歸屬感'};
 const ks=Object.keys(D).sort((a,b)=>s[a]-s[b]);
 const low=ks.filter(k=>s[k]<45);let title,text;
 if(low.length===3){title='三項基本需求目前都偏缺（最低：'+D[ks[0]]+'）';text='三項分數都低於中間值。最高的那項（'+D[ks[2]]+' '+s[ks[2]]+'）只是「相對較高」，不代表已被滿足。'}
 else if(low.length){title='目前最缺乏：'+low.map(k=>D[k]).join('、');text='這些需求目前得到的滿足較少，其餘需求大致尚可。'}
 else{title='三項需求大致都有被滿足';text='沒有特別缺乏的需求。'}
 text+='\n提醒：「重視」某項需求和「實際感受到」是兩回事；勝任感也會受近期精力與情緒影響，低分不一定代表能力不足。';
 return {title,text,tips:['把最低分的需求當成「補給站」：本週安排一件小而具體、能滿足它的事。','若多項需求同時偏低，困擾可能不只是想法，而是生活中能滋養你的部分太少。']};
}
/* ========= 計分（純函式） ========= */
function keysOf(t){return t.kind==='likert'?(t.dims?Object.keys(t.dims):['total']):t.kind==='sum'?['total']:t.kind==='choice'?Object.keys(t.types):t.pairs.map(p=>p[0]+p[1])}
function nameOf(t,k){if(t.kind==='likert')return t.dims?t.dims[k].n:'總分';if(t.kind==='sum')return '總分';if(t.kind==='choice')return t.types[k].n;const p=t.pairs.find(p=>p[0]+p[1]===k);return p[2]+'↔'+p[3]}
function tmax(t){return t.max||100}
const LAYERS=[['f','內在感受'],['j','想法判斷'],['b','實際行為']];
function score(t,ans){
 const s={};
 if(t.kind==='sum'){const a=t.excludeLast?ans.slice(0,-1):ans;s.total=a.reduce((x,y)=>x+y,0)*(t.mult||1)}
 else if(t.kind==='likert'){
  const acc={},L={};
  t.qs.forEach((q,i)=>{const d=t.dims?q[1]:'total';const rev=t.dims?q[2]:q[1];let v=ans[i];if(rev)v=6-v;(acc[d]=acc[d]||[]).push(v);if(t.dims&&q[3])(L[q[3]]=L[q[3]]||[]).push(v)});
  const pc=a=>Math.round((a.reduce((x,y)=>x+y,0)/a.length-1)/4*100);
  for(const d in acc)s[d]=pc(acc[d]);
  for(const l in L)s['_'+l]=pc(L[l]);
  if(t.agg){const ks=Object.keys(t.dims);s.total=Math.round(ks.reduce((a,k)=>a+(t.agg==='raw'?s[k]:(t.dims[k].good?100-s[k]:s[k])),0)/ks.length)}
 }else if(t.kind==='choice'){
  const c={};Object.keys(t.types).forEach(k=>c[k]=0);
  t.qs.forEach((q,i)=>{c[q[1+ans[i]][0]]++});
  for(const k in c)s[k]=Math.round(c[k]/t.qs.length*100);
 }else{
  t.pairs.forEach(p=>{let a=0,n=0;t.qs.forEach((q,i)=>{const l=q[1+ans[i]][0];if(l===p[0]||l===p[1]){n++;if(l===p[0])a++}});s[p[0]+p[1]]=n?Math.round(a/n*100):50});
 }
 return s;
}
function interpret(t,s,ans){
 const r={title:'',text:'',tips:[],items:[]};
 if(t.kind==='sum'){
  const bi=t.bands.findIndex(b=>s.total<=b[0]);const i=bi<0?t.bands.length-1:bi,b=t.bands[i];
  r.title=b[1];r.text=b[2];r.tips=b[3];r.items=[{n:'總分',v:s.total,max:t.max,note:''}];
  const lastA=ans&&ans[ans.length-1],th=t.careLast||1;
  r.care=t.careLow?i===0:(i>=t.careFrom)||!!(t.care9&&lastA>=th);
  if(t.care9&&lastA>=1)r.text+='\n你在最後一題有勾選，請特別留意：這個念頭很重要，值得被認真對待。';
 }else if(t.kind==='likert'&&!t.dims){
  const v=s.total;const b=t.bands.find(b=>v<=b[0])||t.bands[t.bands.length-1];
  r.title=b[1];r.text=b[2];r.tips=b[3];r.items=[{n:'總分',v,note:''}];
 }else if(t.kind==='likert'){
  if(t.result){Object.assign(r,t.result(s))}
  else{const ks=keysOf(t).sort((a,b)=>s[b]-s[a]);const v=s[ks[0]],n=nameOf(t,ks[0]);
   if(v>=65){r.title='最突出：'+n;r.text=t.dims[ks[0]].hi||''}
   else if(v>=45){r.title='相對最高：'+n+'（仍屬中等）';r.text='沒有特別突出的面向。'+n+'只是相對較高，分數仍落在中間。'}
   else{r.title='整體偏低（最高的「'+n+'」也只有 '+v+'）';r.text='「相對最高」不等於「很強」或「已被滿足」：所有面向都低於中間值。'}
   const bad=k=>t.dims[k].good?100-s[k]:s[k];
   const tk=keysOf(t).filter(k=>t.dims[k].tip&&bad(k)>=55).sort((a,b)=>bad(b)-bad(a)).slice(0,3);
   r.tips=tk.map(k=>t.dims[k].n+'：'+t.dims[k].tip);
   r.tips.push('分數只代表你「目前自評」的傾向；請以絕對分數而不是排名來解讀。')}
  r.items=keysOf(t).map(k=>{const d=t.dims[k],v=s[k];return{n:d.n,v,note:v>=65?d.hi:v<=35?d.lo:'介於中間，會隨情境彈性調整。'}});
  if(s._f!=null||s._j!=null||s._b!=null)r.layers=LAYERS.filter(l=>s['_'+l[0]]!=null).map(l=>({n:l[1],v:s['_'+l[0]]}));
 }else if(t.kind==='choice'){
  const ks=keysOf(t).sort((a,b)=>s[b]-s[a]);
  r.title=t.types[ks[0]].n;r.text=t.types[ks[0]].t;r.items=ks.map(k=>({n:t.types[k].n,v:s[k],note:''}));
  r.tips=['這是趣味測驗，結果僅供娛樂與自我對話。'];
 }else{
  const code=t.pairs.map(p=>s[p[0]+p[1]]>=50?p[0]:p[1]).join('');
  r.title=code;r.text=code.split('').map(l=>l+'：'+t.letters[l]).join('\n');
  r.items=t.pairs.map(p=>{const v=s[p[0]+p[1]];const dom=v>=50?p[0]:p[1];return{n:p[2]+'（'+p[0]+'）↔ '+p[3]+'（'+p[1]+'）',v,note:dom+'：'+t.letters[dom]}});
  r.tips=['這只是偏好傾向，不是人格分類的定論，也和官方 MBTI 無關。'];
 }
 return r;
}

const dk=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const kts=k=>new Date(k+'T12:00:00').getTime();
function dform(){if(!S.d){const e=mem.daily.find(x=>x.date===dk(Date.now()));S.d=e?JSON.parse(JSON.stringify(e)):{mood:5,stress:5,sleepQ:3,sleepH:7,lat:15,wake:0,note:'',trig:[],did:[]}}return S.d}
function streak(){const set=new Set(mem.daily.map(x=>x.date));let t=Date.now();if(!set.has(dk(t)))t-=DAY;let n=0;while(set.has(dk(t))){n++;t-=DAY}return n}
function dline(rows,series){
 const n=rows.length;if(!n)return'';
 const W=640,H=230,P=34,t0=rows[0].ts,t1=rows[n-1].ts,span=t1-t0;
 const x=r=>span>0?P+(r.ts-t0)/span*(W-2*P):W/2,y=v=>H-P-v/10*(H-2*P-6);
 let g=[0,5,10].map(v=>`<line x1="${P}" x2="${W-P/2}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".15"/><text x="2" y="${y(v)+4}" font-size="11" fill="currentColor" opacity=".7">${v}</text>`).join('');
 series.forEach(s=>{const rs=rows.filter(r=>r[s.k]!=null);const pts=rs.map(r=>[x(r),y(r[s.k]*(s.mul||1))]);
  g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${s.c}"><title>${s.n}：${rs[i][s.k]}（${rs[i].date}）</title></circle>`).join('')});
 const L=[];rows.forEach((r,i)=>{const X=x(r);if(!L.length||X-L[L.length-1].X>=48)L.push({X,s:md(r.ts)});else if(i===n-1)L[L.length-1]={X,s:md(r.ts)}});
 g+=L.map(l=>`<text x="${l.X}" y="${H-12}" font-size="11" text-anchor="middle" fill="currentColor" opacity=".85">${l.s}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="每日簽到趨勢">${g}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}</div>`;
}
function dInsights(){

 const avg=a=>a.reduce((x,y)=>x+y,0)/a.length,out=[],all=avg(d.map(r=>r.mood));
 const lo=d.filter(r=>r.sleepQ<=2),hi=d.filter(r=>r.sleepQ>=4);

function dl(name,text,mime){try{const b=new Blob([text],{type:mime});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch(e){return false}}
function doImport(){
 let d;try{d=JSON.parse(S.f.imp||'')}catch(e){S.impMsg='格式不正確，請貼上完整的備份文字。';render();return}
 if(!d||!Array.isArray(d.history)){S.impMsg='找不到紀錄。';render();return}
 const seen=new Set(mem.history.map(x=>x.id+'@'+x.ts));let n=0;
 d.history.forEach(x=>{if(x&&byId(x.id)&&x.scores&&x.ts&&!seen.has(x.id+'@'+x.ts)){mem.history.push(x);seen.add(x.id+'@'+x.ts);n++}});
 mem.history.sort((a,b)=>a.ts-b.ts);
 if(d.notes){['worries','moods','thoughts','acts','ladder'].forEach(k=>{mem.notes[k]=mem.notes[k]||[];const s2=new Set(mem.notes[k].map(x=>x.ts));(d.notes[k]||[]).forEach(x=>{if(x&&x.ts&&!s2.has(x.ts)){mem.notes[k].push(x);s2.add(x.ts)}})})}
 if(Array.isArray(d.daily)){const ds=new Set(mem.daily.map(x=>x.date));d.daily.forEach(x=>{if(x&&x.date&&!ds.has(x.date)){mem.daily.push(x);ds.add(x.date)}});mem.daily.sort((a,b)=>a.ts-b.ts)}
 if(Array.isArray(d.planHist)){const ws=new Set(mem.planHist.map(x=>x.week));d.planHist.forEach(x=>{if(x&&x.week&&!ws.has(x.week)){mem.planHist.push(x);ws.add(x.week)}})}
 if(d.plan&&!mem.plan)mem.plan=d.plan;
 if(d.remind&&d.remind.days)mem.remind=d.remind;
 persist();S.f.imp='';S.impMsg='已匯入 '+n+' 筆新紀錄。';render();
}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;
 const a=b.dataset.a,v=b.dataset.v;
 if(a==='tab')go(v);
 else if(a==='cat'){S.cat=v;render()}
 else if(a==='start'){S.tab='lobby';S.res=null;S.run={id:v,i:0,a:[]};render();window.scrollTo(0,0)}
 else if(a==='quit'){S.run=null;render()}
 else if(a==='back'){S.run.i--;render()}
 else if(a==='ans'){const r=S.run,t=byId(r.id);r.a[r.i]=+v;
  if(r.i<t.qs.length-1){const idx=r.i;setTimeout(()=>{if(S.run===r&&r.i===idx){r.i++;render()}},180);render()}
  else finish()}
 else if(a==='growth'){S.tab='growth';S.gsel=v;S.res=null;try{history.replaceState(null,'','#growth')}catch(e){}render();window.scrollTo(0,0)}
 else if(a==='del'){mem.history=mem.history.filter(x=>String(x.ts)!==v);persist();render()}
 else if(a==='wipe'){if(S.confirmWipe){mem.history=[];persist();S.confirmWipe=0}else{S.confirmWipe=1;b.textContent='再按一次確認清除';return}render()}
 else if(a==='set'){S.f[b.dataset.k]=b.dataset.v;render()}
 else if(a==='saveworry'){const f=S.f;if(!f.wtxt)return;mem.notes.worries.push({ts:Date.now(),t:f.wtxt,p:f.wp==null?50:f.wp,a:f.wact||''});persist();['wtxt','wp','wc','wact'].forEach(k=>delete f[k]);render()}
 else if(a==='savemood'){const f=S.f;if(!f.emo)return;mem.notes.moods.push({ts:Date.now(),e:f.emo,i:f.ei==null?5:f.ei,n:f.en||''});persist();['emo','ei','en'].forEach(k=>delete f[k]);render()}
 else if(a==='copy'){const s=$('#sent').textContent;const m=$('#cpmsg');try{navigator.clipboard.writeText(s).then(()=>m.textContent='已複製',()=>m.textContent='請手動選取文字複製')}catch(x){m.textContent='請手動選取文字複製'}}
 else if(a==='tog'){const f=dform(),k=b.dataset.k;f[k]=f[k]||[];const i=f[k].indexOf(v);if(i>=0)f[k].splice(i,1);else f[k].push(v);render()}

 else if(a==='addexp'){const pl=planSync();if(pl.items.length<3&&!pl.items.some(x=>x.id===v)){pl.items.push({id:v,days:[],feel:null,note:''});persist()}render()}
 else if(a==='rmexp'){planSync().items.splice(+v,1);persist();render()}
 else if(a==='pday'){const it=planSync().items[+b.dataset.i],i=it.days.indexOf(v);if(i>=0)it.days.splice(i,1);else it.days.push(v);persist();render()}
 else if(a==='savethought'){const f=S.f;if(!f.tr_auto)return;mem.notes.thoughts.push({ts:Date.now(),ev:f.tr_ev||'',emo:f.tr_emo||'',ei:f.tr_ei==null?5:f.tr_ei,auto:f.tr_auto,pro:f.tr_pro||'',con:f.tr_con||'',alt:f.tr_alt||'',ei2:f.tr_ei2==null?5:f.tr_ei2});persist();['tr_ev','tr_emo','tr_ei','tr_auto','tr_pro','tr_con','tr_alt','tr_ei2'].forEach(k=>delete f[k]);render()}
 else if(a==='addact'){const f=S.f;if(!f.ba_act)return;mem.notes.acts.push({ts:Date.now(),act:f.ba_act,exp:f.ba_exp==null?3:f.ba_exp,real:null});persist();delete f.ba_act;delete f.ba_exp;render()}
 else if(a==='addladder'){const f=S.f;if(!f.ld_what)return;mem.notes.ladder.push({ts:Date.now(),what:f.ld_what,pred:f.ld_pred==null?40:f.ld_pred,real:null});persist();delete f.ld_what;delete f.ld_pred;render()}
 else if(a==='export'){S.exp=JSON.stringify({app:'mood-lab',v:1,exported:new Date().toISOString(),history:mem.history,notes:mem.notes,daily:mem.daily,plan:mem.plan,planHist:mem.planHist,remind:mem.remind||{days:14}});dl('mood-lab-backup-'+new Date().toISOString().slice(0,10)+'.json',S.exp,'application/json');render()}
 else if(a==='copyexp'){const m=$('#cpmsg2');try{navigator.clipboard.writeText(S.exp).then(()=>m.textContent='已複製',()=>{$('#expbox').select();m.textContent='請手動複製'})}catch(x){$('#expbox').select();m.textContent='請手動複製'}}
 else if(a==='import'){doImport()}
 else if(a==='ics'){const d=new Date(Date.now()+DAY),p=n=>String(n).padStart(2,'0');const ds=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T200000';
  S.icsText=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mood Lab//ZH','BEGIN:VEVENT','UID:moodlab-retest@moodlab','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+ds,'RRULE:FREQ=DAILY;INTERVAL='+remDays(),'SUMMARY:Mood Lab：回來看看自己的變化','DESCRIPTION:重測一個你上次做過的測驗，看看變化。','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Mood Lab','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  dl('mood-lab-reminder.ics',S.icsText,'text/calendar');render()}
 else if(a==='breath'){if(S.breath)stopBreath();else startBreath();render()}
});
document.addEventListener('change',e=>{const el=e.target,a=el.dataset.a;
 if(a==='scen'){S.sc=+el.value;render()}
 else if(a==='pfeel'){const it=planSync().items[+el.dataset.i];if(it){it.feel=el.value?+el.value:null;persist()}}
 else if(a==='actreal'&&el.value!==''){const x=mem.notes.acts.find(z=>String(z.ts)===el.dataset.v);if(x){x.real=+el.value;persist();render()}}
 else if(a==='ladreal'&&el.value!==''){const x=mem.notes.ladder.find(z=>String(z.ts)===el.dataset.v);if(x){x.real=+el.value;persist();render()}}
 else if(a==='rdays'){mem.remind={days:+el.value};persist();S.icsText='';render()}
 else if(a==='impfile'&&el.files&&el.files[0]){const rd=new FileReader();rd.onload=()=>{S.f.imp=String(rd.result);doImport()};rd.readAsText(el.files[0])}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.d!=null){const k=el.dataset.d;const v=el.type==='range'?+el.value:el.value;dform()[k]=v;if(el.type==='range'){const b=el.previousElementSibling&&el.previousElementSibling.querySelector('b');if(b)b.textContent=el.value+(el.dataset.unit||'')}return}
 if(el.dataset.p!=null){const it=planSync().items[+el.dataset.p];if(it){it.note=el.value;persist()}return}
 const k=el.dataset.f;if(!k)return;
 if(el.type==='checkbox'){S.f[k]=el.checked;return}
 if(k==='scen')return;
 S.f[k]=el.type==='range'?+el.value:el.value;
 if(el.dataset.live){const lab=el.previousElementSibling.querySelector('b');if(lab)lab.textContent=el.value+(k==='wp'?'%':'')}
 if(['fact','feel','ask','alt'].includes(k)){const f=S.f;$('#sent').textContent=`當${f.fact||'（事實）'}，我覺得${f.feel||'（感受）'}。我希望${f.ask||'（請求）'}。${f.alt?'如果不行，我可以'+f.alt+'。':''}`}
});
function finish(){
 const r=S.run,t=byId(r.id),s=score(t,r.a),x=interpret(t,s,r.a);
 mem.history.push({id:t.id,ts:Date.now(),scores:s,label:x.title,care:!!x.care});persist();
 S.run=null;S.res={t,s,r:x};render();window.scrollTo(0,0);
}
const h0=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h0))S.tab=h0;
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h)&&h!==S.tab)go(h)});
render();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
</body>
</html>
